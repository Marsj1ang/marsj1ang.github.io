<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        html,body {
            height: 100%;
            background-color: #f0f0f0;
            font-size: 60px;
        }
    </style>
</head>
<body onclick="gogogo()">
</body>
<script>
    var num=90;
    function gogogo() {
        if (num >= 0 && num <= 100) {
            if (num % 7 == 0 || num % 10 == 7 || Math.floor(num / 10) === 7) {
                document.body.innerHTML = num + "过";
            } else {
                document.body.innerHTML = num;
            }
            num++;
        } else {
            document.body.innerHTML = "输入错误";
        }
    }
</script>
</html>
